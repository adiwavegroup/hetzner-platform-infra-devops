# READ-ONLY DISCOVERY SNAPSHOT.
# NOT AN ARGO CD OR HELM DEPLOYMENT SOURCE.
# Captured from the live release on 2026-07-30.
#
# This file is EVIDENCE of what is deployed, not a source of truth for deploying it. The real
# deployment source lands under platform/ in the component's own ownership-transfer PR, after a
# rendered-versus-live comparison, an adoption plan, a rollback procedure, a freeze of the previous
# management mechanism, and an Argo CD ownership definition. Until then this repository owns nothing.
#
# Traefik — user-supplied values as deployed.
#
# Provenance: `helm get values traefik -n traefik` on 2026-07-30, NOT copied from any repository.
# The node's shell history contains ZERO helm commands, so this release was installed from a
# workstation and the deployed values are the only trustworthy record of what is running.
#
# Chart: traefik-41.0.2   ·   App: v3.7.6   ·   Namespace: traefik   ·   Release: traefik
#
# Reproduction command, recorded for the future transfer PR — NOT to be run from this path:
#     helm repo add traefik https://traefik.github.io/charts
#     helm upgrade --install traefik traefik/traefik \
#       --version 41.0.2 --namespace traefik --create-namespace -f values.yaml
#
# DO NOT "improve" this file during the ownership transfer. Reproduce current behaviour first;
# every change below is a separate, reviewable PR after adoption is stable.
#
# KNOWN GAP, deliberately preserved for now: there is NO `forwardedHeaders` / `trustedIPs` block.
# Traefik therefore rewrites X-Forwarded-* from the real TCP peer. That is safe today (a forged
# header cannot survive the edge) but becomes a defect the moment Cloudflare proxies traffic, because
# the peer becomes a Cloudflare edge address. See archdesign/architecture.md.
additionalVolumeMounts:
- mountPath: /usr/local/bin
  name: traefik-bin
deployment:
  additionalVolumes:
  - emptyDir: {}
    name: traefik-bin
  initContainers:
  - command:
    - cp
    - /usr/local/bin/traefik
    - /shared/traefik
    image: traefik:v3.7.6
    name: copy-binary
    volumeMounts:
    - mountPath: /shared
      name: traefik-bin
  - command:
    - sh
    - -c
    - apk add --no-cache libcap && setcap cap_net_bind_service=+ep /shared/traefik
    image: alpine:3.21
    name: setcap
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
    volumeMounts:
    - mountPath: /shared
      name: traefik-bin
  kind: DaemonSet
gateway:
  enabled: false
hostNetwork: true
podSecurityContext:
  runAsGroup: 65532
  runAsNonRoot: false
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault
ports:
  web:
    containerPort: 80
    port: 80
  websecure:
    containerPort: 443
    port: 443
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false
securityContext:
  allowPrivilegeEscalation: true
  capabilities:
    add:
    - NET_BIND_SERVICE
    drop:
    - ALL
  runAsNonRoot: true
  runAsUser: 65532
service:
  spec:
    type: ClusterIP
updateStrategy:
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
  type: RollingUpdate
