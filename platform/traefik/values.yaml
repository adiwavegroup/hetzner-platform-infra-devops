# Traefik Helm values -- CANONICAL COPY, NOT YET THE LIVE RECONCILIATION SOURCE.
#
# Migrated from:
#   Granite-Security/sample-shop/k8s/hetzner/platform/traefik-values.yaml
#
# Verified against the live cluster on 2026-07-31:
#   helm release  traefik, namespace traefik, revision 2
#   chart         traefik-41.0.2
#   app version   v3.7.6
#   `helm get values traefik -n traefik` compared to the source file under recursive
#   key-sort normalisation: 25 keys each side, 0 live-only, 0 file-only, 0 differing.
#
# THIS FILE DOES NOT CONTROL LIVE STATE. The existing Helm release does. Nothing here is
# applied, and no Argo CD Application targets this path. Ownership transfers only in the
# post-demo cutover PR.
#
# NEVER create a second Traefik controller. It runs as a hostNetwork DaemonSet bound to
# the node's :80/:443, so exactly one can exist on this single-node cluster. Two
# reconcilers means two controllers fighting over one port binding, which takes down every
# public hostname for every tenant simultaneously.
#
# Copied verbatim. No improvement, upgrade, pinning or redesign -- adoption must not change
# behaviour, and any change here would invalidate the equality proof above.
#
# Helm values for Traefik as the Gateway API implementation on a single bare-metal
# node (no cloud LoadBalancer available on a plain Hetzner VPS). Replaces ingress-nginx
# (see cloudify.md §0: the Kubernetes project is retiring the community ingress-nginx
# controller, and the recommended path forward is Gateway API rather than another
# Ingress controller).
#
# Runs as a hostNetwork DaemonSet bound directly to the node's public IP on 80/443,
# same reasoning as the old ingress-nginx values: that's what Cloudflare's DNS record
# points at.
deployment:
  kind: DaemonSet
  # Binding privileged ports 80/443 as a non-root container needs more than just
  # `securityContext.capabilities.add: [NET_BIND_SERVICE]` below — Kubernetes never
  # populates the Linux "ambient" capability set from that field (a long-standing,
  # known gap: https://github.com/kubernetes/kubernetes/issues/56374), so a non-root
  # process only gets the capability in its *Bounding* set, not *Effective*, and
  # `bind()` on :80/:443 fails with "permission denied" (confirmed on this cluster —
  # `CapEff: 0000000000000000`, only `CapBnd` had the bit). File capabilities via
  # `setcap` bypass that gap entirely, since they're applied at exec time regardless
  # of the ambient set. This two-step init container is Traefik's own documented fix
  # (see EXAMPLES.md "Running on privileged ports with host network"): copy the
  # binary to a shared emptyDir, then `setcap cap_net_bind_service=+ep` on the copy.
  initContainers:
    - name: copy-binary
      image: traefik:v3.7.6
      command: ["cp", "/usr/local/bin/traefik", "/shared/traefik"]
      volumeMounts:
        - name: traefik-bin
          mountPath: /shared
    - name: setcap
      image: alpine:3.21
      command:
        - sh
        - -c
        - apk add --no-cache libcap && setcap cap_net_bind_service=+ep /shared/traefik
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: traefik-bin
          mountPath: /shared
  additionalVolumes:
    - name: traefik-bin
      emptyDir: {}
additionalVolumeMounts:
  - name: traefik-bin
    # Overlays the setcap'd binary copy over the image's original (uncapped) one at
    # the same path, so the main container needs no command/args change.
    mountPath: /usr/local/bin
hostNetwork: true
# The chart's default (maxUnavailable: 0, relying on maxSurge for zero-downtime rollout)
# is rejected outright when hostNetwork is true: a surge pod would need to bind the same
# host port 80/443 on the same node before the old one is removed, which can't work. With
# one node total there's no zero-downtime option anyway — maxUnavailable: 1 just means the
# old pod is torn down before the new one starts, causing a brief connection gap.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
ports:
  web:
    port: 80
    containerPort: 80
  websecure:
    port: 443
    containerPort: 443
# Pod-level default is permissive (runAsNonRoot: false) so the setcap init container
# above can run as root; the main container's own securityContext below still pins it
# to non-root — container-level settings win over the pod-level default per container.
podSecurityContext:
  runAsGroup: 65532
  runAsNonRoot: false
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: true
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
service:
  # Deliberately kept enabled (chart's own privileged-port example disables this
  # entirely) — platform/coredns-custom.yaml's split-horizon override needs a stable
  # ClusterIP to resolve <DOMAIN> to, which only exists if the Service stays enabled.
  #
  # Note: the actual Service kind lives under service.spec.type, not service.type —
  # the latter is a separate chart-internal key (naming/mode logic) and does NOT
  # affect the rendered Service manifest, despite looking like it should.
  spec:
    type: ClusterIP
providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
gateway:
  # Disables the chart's own sample Gateway object — k8s/hetzner/app/gateway.yaml
  # defines ours explicitly (custom hostname, TLS listener, cert-manager annotation).
  # The GatewayClass named "traefik" is still created by providers.kubernetesGateway
  # above; verify with `kubectl get gatewayclass` after install (see cloudify.md).
  enabled: false
